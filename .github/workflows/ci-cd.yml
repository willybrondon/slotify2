  # Flutter App Tests (Cross-platform)
  flutter-tests:
    name: Flutter App Tests
    runs-on: macos-latest # i have change ubuntu to macos 
    strategy:
      matrix:
        app: [customer, expert]
        environment: [dev, prd]
    
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.app }}-${{ hashFiles(format('{0}/flutter/multi_salon_{1}/android/**/gradle-wrapper.properties', matrix.environment, matrix.app)) }}
        restore-keys: |
          gradle-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.app }}-
          gradle-${{ runner.os }}-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
      # setup env 
    

    - name: Get Flutter dependencies
      run: |
        cd "${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}"
        flutter clean
        flutter pub get

    - name: Run Flutter tests
      run: |
        cd "${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}"
        flutter test
    

    # - name: Analyze Flutter code
    #   run: |
    #     cd "${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}"
    #     flutter analyze

    - name: Generate local.properties
      run: |
        cd "${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}"
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
        BUILD_NAME="${VERSION%%+*}"
        BUILD_NUMBER="${VERSION##*+}"
        echo "flutter.sdk=/opt/hostedtoolcache/flutter/stable-3.27.4-x64" > android/local.properties
        echo "sdk.dir=/opt/hostedtoolcache/android-sdk" >> android/local.properties
        echo "flutter.buildMode=release" >> android/local.properties
        echo "flutter.versionName=$BUILD_NAME" >> android/local.properties
        echo "flutter.versionCode=$BUILD_NUMBER" >> android/local.properties

    
    - name: Configure Flutter
      run: |
        flutter config --android-sdk $ANDROID_SDK_ROOT
        flutter doctor

    

    - name: give permission to write togradle
      run: |
        cd "${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}/android"
        chmod +x gradlew

    - name: Clean Flutter project
      run: |
        cd "${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}"
        flutter clean
        flutter pub get
        
    - name: clean gradlew (Android)
      run: |
        cd "${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}/android"
        for attempt in 1 2 3; do
          ./gradlew clean --no-daemon && exit 0
          echo "Gradle clean failed (attempt $attempt), retrying in 15s..."
          sleep 15
        done
        exit 1

    - name: Setup Android Keystore
      run: |
        cd "${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}"
        # Create keystore directory if it doesn't exist
        mkdir -p android/app
        
        # Decode base64 keystore if provided, otherwise generate new one
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Using existing keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        else
          echo "Generating new keystore..."
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias ${KEY_ALIAS:-upload} -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=skedisy, O=skedisy, L=boissy-saint-leger, S=unknown, C=FR"
        fi
        
        # Create key.properties file with secure passwords
        echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
        echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
        echo "keyAlias=${KEY_ALIAS:-upload}" >> android/key.properties
        echo "storeFile=upload-keystore.jks" >> android/key.properties

    - name: Build Flutter APK (Android)
      run: |
        cd "${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}"
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
        BUILD_NAME="${VERSION%%+*}"
        BUILD_NUMBER="${VERSION##*+}"
        flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

    - name: Build Flutter AAB (Android App Bundle)
      run: |
        cd "${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}"
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
        BUILD_NAME="${VERSION%%+*}"
        BUILD_NUMBER="${VERSION##*+}"
        flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
    
    - name: Upload Android APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app-release-apk-${{ matrix.environment }}-${{ matrix.app }}
        path: ${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
        overwrite: false
        retention-days: 3

    - name: Upload Android AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app-release-aab-${{ matrix.environment }}-${{ matrix.app }}
        path: ${{ matrix.environment }}/flutter/multi_salon_${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
        overwrite: false
        retention-days: 3

  
# iOS App Build and Deploy just to rerun
  build_with_signing_ios_app:
    # App Store (depuis avril 2026) exige iOS 26 SDK → Xcode 26+ (ITMS-90725)
    runs-on: macos-26
    strategy:
      matrix:
        app: [customer, expert]
        environment: [dev]
    steps:
      - name: Select Xcode 26 (iOS 26 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version
          echo "Installed iOS SDKs:"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      # - name: Clean Derived Data A
      #   run: |
      #     rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Get Flutter dependencies
        run: |
          cd "dev/flutter/multi_salon_${{ matrix.app }}"
          flutter clean
          flutter pub get
          flutter pub upgrade
      

      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          # PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          PP_ARCHIVE=$RUNNER_TEMP/mobile_pp.tgz
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          # echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_ARCHIVE

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          # mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles  


          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          tar xzvf $PP_ARCHIVE -C $RUNNER_TEMP
          for PROVISION in `ls $RUNNER_TEMP/*.mobileprovision`
          do
            UUID=`/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i $PROVISION)`
            cp $PROVISION ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          done
          

      - name: List Provisioning Profiles
        run: ls -l ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: List Code Signing Identities
        run: security find-identity -v -p codesigning

      - name: Check Provisioning Profile Content
        run: |
          ls ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "=== Profile Details ==="
          for profile in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "Profile: $profile"
            echo "--- Content ---"
            security cms -D -i "$profile" | grep -A1 -B1 -E "(application-identifier|TeamIdentifier|Name|UUID|Entitlements)" || true
            echo "---"
          done
       

      - name: Verify iOS provisioning profiles
        run: |
          set -e
          find_profile() {
            local expected="$1"
            for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
              NAME=$(security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || true)
              if [ "$NAME" = "$expected" ]; then
                echo "$f"
                return 0
              fi
            done
            return 1
          }

          if [ "${{ matrix.app }}" = "customer" ]; then
            MAIN=$(find_profile "appstore-skedisy-customer") || {
              echo "::error::Missing profile appstore-skedisy-customer in BUILD_PROVISION_PROFILE_BASE64"
              exit 1
            }
            SHARE=$(find_profile "appstore-skedisy-customer-share") || {
              echo "::error::Missing profile appstore-skedisy-customer-share in BUILD_PROVISION_PROFILE_BASE64"
              exit 1
            }
            ENT=$(security cms -D -i "$MAIN")
            echo "$ENT" | grep -q "com.apple.security.application-groups" || {
              echo "::error::appstore-skedisy-customer missing App Groups — regenerate profile after linking group.com.skedisy.customer"
              exit 1
            }
            echo "$ENT" | grep -q "group.com.skedisy.customer" || {
              echo "::error::appstore-skedisy-customer missing group.com.skedisy.customer"
              exit 1
            }
            SHARE_ENT=$(security cms -D -i "$SHARE")
            echo "$SHARE_ENT" | grep -q "com.apple.security.application-groups" || {
              echo "::error::appstore-skedisy-customer-share missing App Groups — regenerate profile on App ID com.skedisy.customer.ShareExtension"
              exit 1
            }
            echo "$SHARE_ENT" | grep -q "group.com.skedisy.customer" || {
              echo "::error::appstore-skedisy-customer-share missing group.com.skedisy.customer"
              exit 1
            }
            echo "$SHARE_ENT" | grep -q "com.skedisy.customer.ShareExtension" || {
              echo "::error::appstore-skedisy-customer-share bundle ID mismatch (expected com.skedisy.customer.ShareExtension)"
              exit 1
            }
            echo "App Groups OK in appstore-skedisy-customer and appstore-skedisy-customer-share"
            echo "Customer profiles OK: $MAIN"
            echo "Share Extension profile OK: $SHARE"
          fi

          if [ "${{ matrix.app }}" = "expert" ]; then
            find_profile "appstore-skedisy-expert" || {
              echo "::error::Missing profile appstore-skedisy-expert in BUILD_PROVISION_PROFILE_BASE64"
              exit 1
            }
            echo "Expert profile OK"
          fi
      - name: install pod ios for testting
        run: |
          cd "dev/flutter/multi_salon_${{ matrix.app }}/ios"
          rm -rf ~/Library/Developer/Xcode/DerivedData
          pod cache clean --all
          rm -rf Podfile.lock Pods
          pod deintegrate
          pod install --repo-update

      - name: build archive
        run: |
          set -euo pipefail
          cd "dev/flutter/multi_salon_${{ matrix.app }}/ios"
          xcodebuild -workspace Runner.xcworkspace -scheme "Runner" \
          -archivePath $RUNNER_TEMP/Runner.xcarchive \
          -sdk iphoneos \
          -configuration Release \
          -destination generic/platform=iOS \
          DEVELOPMENT_TEAM=7B755FRMAM \
          APS_ENVIRONMENT=production \
          clean archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"
          if [ "${{ matrix.app }}" = "customer" ]; then
            PLUGINS="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app/PlugIns"
            ls -la "$PLUGINS" || true
            test -d "$PLUGINS/Share Extension.appex" || {
              echo "::error::Share Extension.appex missing from archive — Partager vers Skedisy will not work"
              tail -80 "$RUNNER_TEMP/xcodebuild-archive.log" || true
              exit 1
            }
            echo "Share Extension embedded in IPA archive."
          fi

      - name: export ipa
        run: |
          set -euo pipefail
          ls -l $RUNNER_TEMP/Runner.xcarchive
          ls -l $RUNNER_TEMP/Runner.xcarchive/Products/Applications/
          EXPORT_OPTS_PATH="dev/flutter/multi_salon_${{ matrix.app }}/ios/exportOptions-${{ matrix.app }}.plist"
          test -f "$EXPORT_OPTS_PATH" || {
            echo "::error::Missing $EXPORT_OPTS_PATH (Share Extension needs com.skedisy.customer.ShareExtension → appstore-skedisy-customer-share)"
            exit 1
          }
          echo "Using export options:"
          plutil -p "$EXPORT_OPTS_PATH"
          if [ "${{ matrix.app }}" = "customer" ]; then
            SHARE_PROFILE=$(/usr/libexec/PlistBuddy -c 'Print :provisioningProfiles:com.skedisy.customer.ShareExtension' "$EXPORT_OPTS_PATH" 2>/dev/null || true)
            if [ "$SHARE_PROFILE" != "appstore-skedisy-customer-share" ]; then
              echo "::error::exportOptions-customer.plist must map com.skedisy.customer.ShareExtension to appstore-skedisy-customer-share (got: $SHARE_PROFILE)"
              exit 1
            fi
          fi
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Runner.xcarchive -exportOptionsPlist "$EXPORT_OPTS_PATH" -exportPath $RUNNER_TEMP/build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-export.log"

          ls -l $RUNNER_TEMP/build

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-${{ matrix.environment }}-${{ matrix.app }}
          path: ${{ runner.temp }}/build/multi_salon_${{ matrix.app }}.ipa
          # you can also archive the entire directory oka 
          # path: ${{ runner.temp }}/build
          retention-days: 3

  # Deploy to Development Environment
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [admin-tests, flutter-tests]
    if: github.ref == 'refs/heads/develop'
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Download admin artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: admin-folder-*
        merge-multiple: true

    - name: Deploy Admin Panel to Dev
      run: |
        echo "Deploying admin panel to development environment..."
        # Add your dev deployment logic here
        # This could be deploying to a dev server or staging environment

    - name: Deploy Flutter Apps to Dev
      run: |
        echo "Deploying Flutter apps to development environment..."
        chmod +x scripts/deploy-flutter.sh
        ./scripts/deploy-flutter.sh dev

  # Deploy to Production Environment
  deploy-prd:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [admin-tests, flutter-tests]
    if: github.ref == 'refs/heads/main'
    environment: prd
    
    steps:
