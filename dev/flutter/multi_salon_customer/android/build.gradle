buildscript {
    ext.kotlin_version = '2.0.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.15'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects { sub ->
    sub.buildDir = "${rootProject.buildDir}/${sub.name}"
    sub.afterEvaluate {
        def androidExt = sub.extensions.findByName("android")
        if (androidExt != null) {
            androidExt.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        // Do NOT force Billing 8 here: in_app_purchase_android 0.4.x is compiled
        // against Billing 7.1.1 APIs. Forcing 8.0.0 breaks the Java build
        // (QueryProductDetailsResult / queryPurchaseHistoryAsync).
        // Billing 8 requires in_app_purchase_android >= 0.5.0 + Flutter >= 3.38.
    }
    sub.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
