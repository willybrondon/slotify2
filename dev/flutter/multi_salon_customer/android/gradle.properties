org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
# Flutter Gradle Plugin still uses legacy AGP APIs (AbstractAppExtension).
# Required until FGP fully migrates; see flutter/flutter#184838 / #192111.
android.newDsl=false
android.builtInKotlin=false
# AGP 9 rejects getDefaultProguardFile('proguard-android.txt') in older plugins
# (e.g. flutter_inappwebview_android 1.1.3). Escape hatch until plugins migrate; removed in AGP 10.
android.r8.proguardAndroidTxt.disallowed=false
