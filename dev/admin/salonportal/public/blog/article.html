<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article — Blog Skedisy</title>
    <meta name="description" content="Article du blog Skedisy — beauté afro en Île-de-France.">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="canonical" href="https://skedisy.com/blog/">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <meta name="theme-color" content="#c45c26">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../cookie-consent.css">
    <link rel="stylesheet" href="../public-pages.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
    <script src="../language.js" defer></script>
</head>
<body class="client-page sq-page sk-public-page sq-blog-page sq-article-page" data-page="client">
    <div class="qr-topright qr-topright--client desktop-only">
        <div class="qr-top-flex">
            <div class="qr-top-block" data-app-type="customer" onclick="openPhoneSelection('customer')">
                <div class="qr-code-wrapper"><div id="qr-customer-top"></div></div>
                <div class="qr-label" data-translate="qr.customerApp">Download Customer App</div>
            </div>
        </div>
    </div>

    <nav class="navbar sq-navbar sq-navbar--adencer">
        <div class="nav-container sq-adencer-header">
            <div class="nav-logo">
                <a href="/" style="text-decoration: none; color: inherit; display:inline-flex; align-items:center; gap:8px;">
                    <img class="sq-nav-logo-img" src="/images/logo.png" alt="Skedisy" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                    <h2 style="margin:0;">Skedisy</h2>
                </a>
            </div>
            <div class="sq-adencer-header__links desktop-only">
                <a href="/blog/" data-translate="nav.blog">Blog</a>
                <a href="/aide/" data-translate="nav.help">Aide</a>
                <a href="/professionnel/" data-translate="nav.pro">Pro</a>
                <button type="button" class="lang-switcher" data-lang="en" title="Language"><i class="fas fa-globe"></i> <span>FR</span></button>
            </div>
            <div class="sq-adencer-header__cta desktop-only">
                <a href="/compte/connexion" class="sq-btn sq-btn-ghost" data-translate="nav.login">Connexion</a>
                <a href="/compte/inscription" class="sq-btn sq-btn-fill" data-translate="nav.createAccount">Créer un compte</a>
            </div>
            <div class="mobile-menu-wrapper">
                <div class="hamburger mobile-only" id="mobileMenuToggle"><span></span><span></span><span></span></div>
            </div>
        </div>
        <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>
        <div class="mobile-menu" id="mobileMenu">
            <div class="mobile-menu-header">
                <h3 data-translate="nav.forClients">Pour les clientes</h3>
                <div class="mobile-menu-header-right">
                    <button class="lang-switcher mobile-only" data-lang="en" title="Passer en anglais"><i class="fas fa-globe"></i> <span>FR</span></button>
                    <button class="mobile-menu-close" id="mobileMenuClose" type="button" aria-label="Fermer">&times;</button>
                </div>
            </div>
            <div class="mobile-menu-content mobile-menu-content--client">
                <a href="/compte/connexion" class="btn-login-mobile-menu" data-translate="nav.login">Connexion</a>
                <a href="/compte/inscription" class="btn-login-mobile-menu" data-translate="nav.createAccount">Créer un compte</a>
                <a href="/blog/" class="btn-login-mobile-menu" data-translate="nav.blog">Blog</a>
                <a href="/aide/" class="btn-login-mobile-menu" data-translate="nav.help">Aide</a>
                <button type="button" class="btn-login-mobile-menu btn-mobile-action" data-mobile-download="customer" data-translate="client.downloadAppCta">Télécharger l'app</button>
                <div class="mobile-categories-panel">
                    <button type="button" class="btn-login-mobile-menu mobile-categories-toggle" id="mobileCategoriesToggle" aria-expanded="false" aria-controls="mobileCategoriesDrawer">
                        <span data-translate="nav.allCategories">Toutes les catégories</span>
                        <i class="fas fa-chevron-down mobile-categories-toggle__icon" aria-hidden="true"></i>
                    </button>
                    <div class="mobile-categories-drawer" id="mobileCategoriesDrawer" hidden>
                        <div class="mobile-categories-drawer__head">
                            <span data-translate="nav.allCategories">Toutes les catégories</span>
                            <button type="button" class="mobile-categories-drawer__close" id="mobileCategoriesClose" aria-label="Fermer">&times;</button>
                        </div>
                        <div class="mobile-categories" id="mobileCategories"></div>
                    </div>
                </div>
                <a href="/professionnel/" class="btn-login-mobile-menu btn-for-business-mobile" data-translate="nav.forBusiness">Pour les professionnels</a>
            </div>
        </div>
    </nav>

    <main class="sq-blog-main">
        <div class="container" id="sq-article-root"></div>
    </main>

    <footer class="footer sq-footer">
        <div class="container">
            <div class="footer-bottom">
                <p data-translate="footer.rights">&copy; 2024 Skedisy. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../cookie-consent.js"></script>
    <script src="../script.js"></script>
    <script src="../blog-article.js"></script>
</body>
</html>
